name: Build Nuvio Xbox APPX

on:
  workflow_dispatch:
  push:
    branches:
      - port/xbox-devmode
    paths:
      - 'xbox/**'
      - '.github/workflows/xbox-appx.yml'

permissions:
  contents: read

jobs:
  build-appx:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create temporary development signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=NuvioXboxDev' `
            -FriendlyName 'Nuvio Xbox Dev Mode - temporary' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyUsage DigitalSignature `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3') `
            -NotAfter (Get-Date).AddYears(1)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'NuvioXboxDev.pfx'
          $cerPath = Join-Path $env:RUNNER_TEMP 'NuvioXboxDev.cer'
          $password = [Guid]::NewGuid().ToString('N')
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          "APPX_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV
          "APPX_CER_PATH=$cerPath" >> $env:GITHUB_ENV
          "APPX_PFX_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Restore, build and sign x64 APPX
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'xbox/NuvioXbox/NuvioXbox.csproj'
          msbuild $project /restore /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageSigningEnabled=true `
            "/p:PackageCertificateKeyFile=$env:APPX_PFX_PATH" `
            "/p:PackageCertificatePassword=$env:APPX_PFX_PASSWORD" `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'xbox/NuvioXbox/artifacts'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item $env:APPX_CER_PATH (Join-Path $artifactDir 'NuvioXboxDev.cer') -Force
          $packages = @(Get-ChildItem $artifactDir -Recurse -File -Filter '*.appx')
          if ($packages.Count -eq 0) { throw 'MSBuild completed but no .appx package was found.' }
          Get-ChildItem $artifactDir -Recurse -File | Select-Object FullName,Length

      - name: Upload signed APPX and development certificate
        uses: actions/upload-artifact@v4
        with:
          name: NuvioXbox-APPX-x64
          path: xbox/NuvioXbox/artifacts/**
          if-no-files-found: error
          retention-days: 14
